<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fbcfe8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Shadow -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" filter="url(#cardShadow)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>

  <!-- Background Data Grid Sub-lines -->
  <line x1="12" y1="46" x2="52" y2="46" stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="12" y1="36" x2="52" y2="36" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="12" y1="26" x2="52" y2="26" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Histogram / Bar Chart Bars -->
  <rect x="14" y="32" width="7" height="14" rx="2.5" fill="url(#barGrad1)"/>
  <rect x="24" y="22" width="7" height="24" rx="2.5" fill="url(#barGrad2)"/>
  <rect x="34" y="27" width="7" height="19" rx="2.5" fill="url(#barGrad1)"/>
  <rect x="44" y="16" width="7" height="30" rx="2.5" fill="url(#barGrad3)"/>

  <!-- Upward Statistical Trend Curve / Regression Spline -->
  <path d="M 12 40 C 20 38, 26 26, 35 24 C 41 22, 47 15, 52 13" 
        fill="none" 
        stroke="url(#lineGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        filter="url(#glow)"/>

  <!-- Trend Line Node Points -->
  <circle cx="14" cy="39" r="2.2" fill="#ffffff" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="27" cy="27" r="2.2" fill="#ffffff" stroke="#fbbf24" stroke-width="1.2"/>
  <circle cx="40" cy="19" r="2.2" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <circle cx="51" cy="13" r="2.6" fill="#ffffff" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/>
</svg>
